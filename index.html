<style>
:root{--bg:#081326;--panel:#0f2347;--panel2:#132b57;--bd:#24407a;--tx:#eef3fb;--mu:#9db0d0;--red:#e11d2e;--blue:#2f5bd1;--light:#e8f1fb}
*{box-sizing:border-box}
body{margin:0;font:16px system-ui,"Segoe UI",sans-serif;color:var(--tx);min-height:100vh;
 background:radial-gradient(1200px 500px at 50% -100px,#17356b,transparent),linear-gradient(180deg,#081326,#0b1b38)}
header{background:linear-gradient(90deg,#0a1a38,#122a58);border-bottom:3px solid var(--red)}
.top{max-width:1040px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.top img{height:58px;border-radius:8px;display:block}
.brand{flex:1;min-width:220px}.brand h1{margin:0;font-size:1.5rem;letter-spacing:.04em;text-transform:uppercase}
.brand small{color:var(--mu);letter-spacing:.2em;font-size:.68rem;text-transform:uppercase}
.bar{background:#0a1a38;border-bottom:1px solid var(--bd)}
.barin{max-width:1040px;margin:0 auto;padding:8px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button,.btn{border:0;border-radius:8px;padding:9px 16px;font:600 .85rem inherit;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;background:transparent;color:var(--tx);text-decoration:none;display:inline-block}
nav button:hover{background:var(--panel2)}nav button.on{background:var(--red);color:#fff}
.btn{background:var(--red);color:#fff}.btn:hover{filter:brightness(1.12)}.btn.s{background:var(--panel2);border:1px solid var(--bd)}
main{max-width:1040px;margin:22px auto;padding:0 16px}
.card{background:var(--panel);border:1px solid var(--bd);border-radius:12px;padding:20px;margin-bottom:16px}
.card h2,.card h3{margin:0 0 14px;text-transform:uppercase;letter-spacing:.05em;padding-bottom:8px;border-bottom:2px solid var(--red);display:inline-block}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:16px}
.grid .card{margin:0;border-top:3px solid var(--blue)}
.stat b{font-size:1.8rem;display:block}.stat span,.mu{color:var(--mu);font-size:.9rem;text-transform:none}
.stat span{text-transform:uppercase;letter-spacing:.08em;font-size:.75rem}
input,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:#0a1a38;color:var(--tx);font:inherit}
input:focus,textarea:focus{outline:2px solid var(--blue);border-color:var(--blue)}
label{display:block;font-size:.78rem;color:var(--mu);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.08em}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px 8px;border-bottom:1px solid var(--bd);font-size:.92rem}
th{color:var(--mu);font-size:.75rem;text-transform:uppercase;letter-spacing:.08em}
.msg{padding:12px 14px;border-radius:8px;background:var(--panel2);border-left:4px solid var(--red);margin-bottom:14px}.hide{display:none}
.user{display:flex;align-items:center;gap:10px;font-size:.9rem}.user img{width:30px;height:30px;border-radius:50%}
.badge{background:var(--blue);border-radius:6px;padding:2px 8px;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em}
footer{text-align:center;color:var(--mu);font-size:.85rem;padding:24px 16px 32px}footer i{display:block;margin-top:4px}
@media(max-width:560px){.row{grid-template-columns:1fr}.brand h1{font-size:1.15rem}}
